[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfleet"
version = "0.1.0"
description = "Reproducible multi-node DGX Spark inference: recipes, measured optimization, API qualification and rollback evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "SparkFleet contributors"}]
keywords = ["dgx-spark", "gb10", "deepseek", "glm", "vllm", "inference"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://github.com/sumsliu/spark-fleet"
Issues = "https://github.com/sumsliu/spark-fleet/issues"

[project.optional-dependencies]
gateway = ["aiohttp>=3.14.5,<4"]

[project.scripts]
sparkfleet = "sparkfleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
