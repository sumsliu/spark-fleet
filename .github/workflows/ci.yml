name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[gateway]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: python scripts/check_docs.py
      - run: sparkfleet validate examples/deepseek-tp4.json --template
      - run: sparkfleet validate examples/glm-tp8.json --template
      - run: sparkfleet audit-public .
